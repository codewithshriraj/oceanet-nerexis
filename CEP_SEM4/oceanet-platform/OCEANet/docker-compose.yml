version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: oceanet-postgres
    environment:
      POSTGRES_USER: oceanet
      POSTGRES_PASSWORD: oceanet_dev_password
      POSTGRES_DB: oceanet_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oceanet-network

  # Redis Cache (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: oceanet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oceanet-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanet-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OCEANET_ENV: development
      OCEANET_DEBUG: "1"
      OCEANET_LOG_LEVEL: DEBUG
      OCEANET_DB_TYPE: postgres
      OCEANET_DB_HOST: postgres
      OCEANET_DB_PORT: 5432
      OCEANET_DB_USER: oceanet
      OCEANET_DB_PASSWORD: oceanet_dev_password
      OCEANET_DB_NAME: oceanet_dev
      OCEANET_JWT_SECRET: dev-secret-key-change-in-production
      OCEANET_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000"
      OCEANET_DATA_ROOT: /app/data
      # AI Providers (optional)
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      OCEANET_AI_PROVIDER: local
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - /app/__pycache__
    networks:
      - oceanet-network
    command: >
      sh -c "
        pip install -r requirements.txt &&
        alembic upgrade head &&
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oceanet-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - oceanet-network
    command: npm run dev

  # Adminer (Database management UI - optional)
  adminer:
    image: adminer:latest
    container_name: oceanet-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - oceanet-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_data:
    driver: local

networks:
  oceanet-network:
    driver: bridge
