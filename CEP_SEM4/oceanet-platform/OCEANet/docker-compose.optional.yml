version: "3.9"

services:
  neo4j:
    image: neo4j:5.15
    container_name: oceanet-neo4j
    environment:
      - NEO4J_AUTH=neo4j/changeme
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - oceanet-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: oceanet-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - oceanet-network

  mlflow:
    image: cr.flyte.org/mlflow/mlflow:latest
    container_name: oceanet-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://localhost:5000
    networks:
      - oceanet-network

  kafka:
    image: bitnami/kafka:latest
    container_name: oceanet-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - oceanet-network

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: oceanet-zookeeper
    ports:
      - "2181:2181"
    networks:
      - oceanet-network

volumes:
  qdrant_storage:
    driver: local

networks:
  oceanet-network:
    driver: bridge
